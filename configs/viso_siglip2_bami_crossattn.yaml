# ViSO on ViVQA-S1 v2.0 with frozen SigLIP 2 + frozen BamiBERT + CANDIDATE CROSS-ATTENTION (ChoiceHead)
# Fixes the encoder pooling bottleneck by allowing candidate queries to cross-attend to unpooled visual patch tokens.
TASK: TypedDecisionTask

DATASET:
  FEATURE_DATASET:
    TYPE: S1FeatureDataset
    BATCH_SIZE: 64
    WORKERS: 0
    FEATURE_CACHE: 0
    FEATURE_FORMAT: packed
    PACKED_PATH: ~/data/siglip2_packed
    TEXT_CACHE: ~/data/bamibert_cache
    TEXT_CACHE_POOL: mean
    TEXT_CACHE_STANDARDIZE: True
    USE_BOXES: True
    LIMIT: 0
    NOUL_TRAIN_FRACTION: 1.0
    NOUL_SUBSET_SEED: 0
    TEACHER_TRAIN: ''
    EXTRA_TRAIN: ''
    FEATURE_PATH:
      FEATURES: null
  VOCAB:
    TYPE: S1Vocab
    TOKENIZER: null
    MIN_FREQ: 1
    BOS_TOKEN: <bos>
    EOS_TOKEN: <eos>
    PAD_TOKEN: <pad>
    UNK_TOKEN: <unk>
    S1_DIR: ../vivqa_s1_v2/data

TRAINING:
  SEED: 0
  CHECKPOINT_PATH: saved_models
  OUTPUT_PATH: output/viso_crossattn
  EPOCHS_SUP: 25
  PATIENCE: 5
  EPOCHS_RL: 5
  LR_ENCODER: 0.0002
  LR_HEADS: 0.001
  WEIGHT_DECAY: 0.01
  WARMUP_STEPS: 500
  GRAD_CLIP: 1.0
  VISION_PATH_AS_HEADS: False
  TEXT_PROJ_AS_HEADS: False
  ENCODER_AS_HEADS: False
  AMP: False
  RESUME: False
  DEADLINE_UNIX: 0.0
  STOP_AFTER_EPOCHS: 0

LOSS:
  NAME: soft_ce
  STAGE: all
  TYPE_BALANCE: False
  KD_WEIGHT: 0.0
  TYPE_WEIGHTS: [1.0, 1.0, 1.0]
  PG_WEIGHT: 1.0
  PG_SIGMA_SCALE: False
  NUM_SAMPLES: 4
  SIGMA_START: 0.4
  SIGMA_END: 0.1
  SPHERICAL_WEIGHT: 0.75
  RPS_WEIGHT: 1.0

MODEL:
  ARCHITECTURE: ViSO
  NAME: viso_s1_crossattn
  DEVICE: cuda
  D_MODEL: 512
  CONSTITUENT_LAYERS: 3
  STRICT_TEXT_MASK: True
  FUSION_PRODUCT: False
  FUSION_DROPOUT: 0.0
  ATTR_REDUCE_INIT_STD: 0.0

  ZERO_VISION: False
  SET_ATTENTION: True
  SHARE_EMBEDDING: True
  SET_LAYERS: 2
  SET_HEADS: 8
  SET_FF: 1024
  SET_DROPOUT: 0.1
  HEAD_DROPOUT: 0.1

  CHOICE_CROSS_ATTENTION: True
  CHOICE_CROSS_HEADS: 8
  CHOICE_CROSS_DROPOUT: 0.1

  VISION_EMBEDDING:
    ARCHITECTURE: FeatureEmbedding
    D_FEATURE: 768
    D_MODEL: 512
    DROPOUT: 0.1
    USE_BOXES: True
    FEATURE_NORM: False
  TEXT_EMBEDDING:
    ARCHITECTURE: CachedBertEmbedding
    D_MODEL: 512
    D_EMBEDDING: 768
    DROPOUT: 0.1
    WORD_EMBEDDING: null
    WORD_EMBEDDING_CACHE: null
  SELF_ENCODER:
    ARCHITECTURE: Encoder
    D_MODEL: 512
    LAYERS: 3
    SELF_ATTENTION:
      ARCHITECTURE: ScaledDotProductAttention
      HEAD: 8
      D_MODEL: 512
      D_KEY: 64
      D_VALUE: 64
      D_FF: 2048
      D_FEATURE: 768
      USE_AOA: False
      CAN_BE_STATEFUL: False
      DROPOUT: .1
  GUIDED_ENCODER:
    ARCHITECTURE: GuidedAttentionEncoder
    D_MODEL: 512
    LAYERS: 3
    SELF_ATTENTION:
      ARCHITECTURE: ScaledDotProductAttention
      HEAD: 8
      D_MODEL: 512
      D_KEY: 64
      D_VALUE: 64
      D_FF: 2048
      D_FEATURE: 768
      USE_AOA: False
      CAN_BE_STATEFUL: False
      DROPOUT: .1
    GUIDED_ATTENTION:
      ARCHITECTURE: ScaledDotProductAttention
      HEAD: 8
      D_MODEL: 512
      D_KEY: 64
      D_VALUE: 64
      D_FF: 2048
      D_FEATURE: 768
      USE_AOA: False
      CAN_BE_STATEFUL: False
      DROPOUT: .1
  VISION_ATTR_REDUCE:
    D_MODEL: 512
    DROPOUT: 0.1
  TEXT_ATTR_REDUCE:
    D_MODEL: 512
    DROPOUT: 0.1
